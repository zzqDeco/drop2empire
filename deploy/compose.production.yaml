name: drop2empire

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  web:
    image: ${WEB_IMAGE:?web image required}
    restart: unless-stopped
    read_only: true
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    ports:
      - "${PUBLIC_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:${ADMIN_TUNNEL_PORT:-18480}:18480"
    volumes:
      - ${TLS_CERT_DIR:-/srv/drop2empire/tls}:/etc/nginx/tls:ro
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    networks: [edge, private]
    logging: *logging
    depends_on:
      game: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 3s
      retries: 6

  game:
    image: ${GAME_IMAGE:?game image required}
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 96m
    memswap_limit: 96m
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-drop2empire}:${POSTGRES_PASSWORD:?postgres password required}@postgres:5432/${POSTGRES_DB:-drop2empire}?sslmode=disable
      GOMEMLIMIT: 72MiB
      GOMAXPROCS: "1"
    networks: [private]
    logging: *logging
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: ${POSTGRES_IMAGE:?postgres image required}
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 160m
    shm_size: 32m
    pids_limit: 96
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drop2empire}
      POSTGRES_DB: ${POSTGRES_DB:-drop2empire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postgres password required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=25
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    logging: *logging
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, "${POSTGRES_USER:-drop2empire}", -d, "${POSTGRES_DB:-drop2empire}"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  edge: {}
  private: {internal: true}

volumes:
  postgres_data: {}
