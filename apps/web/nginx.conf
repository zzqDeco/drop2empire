# Public Player Surface (ports 80 / 8443 TLS)
# Strictly blocks /admin UI and all admin/debug API routes from the public internet.
server {
    listen 80;
    listen [::]:80;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        proxy_pass http://game:8080/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Block Admin UI on public listener
    location ^~ /admin {
        return 404;
    }

    # Block Admin & Debug API routes on public listener
    location ~ ^/api/v1/empire/(admin|debug|account/switch|war/settle) {
        return 404;
    }

    location /api/ {
        proxy_pass http://game:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-Tunnel "0";
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Loopback-Only SSH Tunnel Admin Surface (bound strictly to 127.0.0.1:18480 on host)
# Access via: ssh -L 18480:127.0.0.1:18480 root@<ECS_IP> -> http://127.0.0.1:18480/admin
server {
    listen 18480;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / {
        return 302 /admin;
    }

    location /api/ {
        proxy_pass http://game:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-Tunnel "1";
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
