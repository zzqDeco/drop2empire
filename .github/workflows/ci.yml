name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-postgres
          POSTGRES_DB: drop2empire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d drop2empire_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: |
            pkg/go.sum
            contracts/gen/game/go.sum
            services/game/go.sum
      - name: Enforce Clean DDD dependency boundaries
        run: bash ops/check-architecture.sh
      - name: Run race tests, vet and build across all Go modules
        env:
          DATABASE_URL_TEST: postgres://postgres:ci-only-postgres@127.0.0.1:5432/drop2empire_test?sslmode=disable
        run: |
          for module in pkg contracts/gen/game services/game; do
            (cd "$module" && go test -race ./... && go vet ./... && go build ./...)
          done
      - name: Reproduce economy calibration reports
        run: |
          make simulate-economy > /tmp/s1-industry-14d.json
          (cd services/game && go run ./cmd/economy-sim -consumables) > /tmp/s1-consumables-costs.json
          cmp /tmp/s1-industry-14d.json docs/design/04-seasons/simulation/s1-industry-14d.json
          cmp /tmp/s1-consumables-costs.json docs/design/04-seasons/simulation/s1-consumables-costs.json
          (cd services/game && go run ./cmd/economy-sim -launch) > /tmp/s1-launch-progression.json
          cmp /tmp/s1-launch-progression.json docs/design/04-seasons/simulation/s1-launch-progression.json
